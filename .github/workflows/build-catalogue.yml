name: Build All products catalogue
on:
  push:
    branches: [main]
    paths:
      - product-data.json
      - 'products/**'
      - 'product/**'
      - 'industries/**'
      - 'services/**'
      - .github/scripts/build_catalogue.py
      - .github/scripts/build_search_index.py
      - .github/scripts/site_sync.py
      - .github/category-menu.json
      - .github/legacy-pages.json
      - .github/scripts/legacy_pages.py
      - index.html
      - 'about-us/**'
      - 'faq/**'
      - llms.txt
  workflow_dispatch:
permissions:
  contents: read
  pages: write
concurrency:
  group: build-catalogue
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild L1 "All products" grids from product-data.json
        run: python .github/scripts/build_catalogue.py
      - name: Sync site-wide category, product and industry figures
        run: python .github/scripts/site_sync.py build
      - name: Rebuild site search index from product-data.json and pages
        run: python .github/scripts/build_search_index.py
      - name: Refresh old Google URLs (copies of their new pages, canonical to new page)
        run: python .github/scripts/legacy_pages.py build
      - name: Report (never commits) and rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This job NEVER commits or pushes. All generated files are built locally
          # before every commit, so the remote branch only ever receives the user's own
          # commits and GitHub Desktop never shows "Newer commits on remote".
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Generated files differ from the commit. Run the 6 local builds (incl. legacy_pages.py build) and commit again."
            git status --porcelain | head -50
          else
            echo "Catalogue, site figures, search index and legacy pages are up to date"
          fi
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

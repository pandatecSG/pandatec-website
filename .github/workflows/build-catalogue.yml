name: Build All products catalogue
on:
  push:
    branches: [main]
    paths:
      - product-data.json
      - 'products/**'
      - 'product/**'
      - 'industries/**'
      - 'services/**'
      - .github/scripts/build_catalogue.py
      - .github/scripts/build_search_index.py
      - .github/scripts/site_sync.py
      - .github/category-menu.json
      - .github/legacy-pages.json
      - .github/scripts/legacy_pages.py
      - index.html
      - 'about-us/**'
      - 'faq/**'
      - llms.txt
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: build-catalogue
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild L1 "All products" grids from product-data.json
        run: python .github/scripts/build_catalogue.py
      - name: Sync site-wide category, product and industry figures
        run: python .github/scripts/site_sync.py build
      - name: Rebuild site search index from product-data.json and pages
        run: python .github/scripts/build_search_index.py
      - name: Refresh old Google URLs (copies of their new pages, canonical to new page)
        run: python .github/scripts/legacy_pages.py build
      - name: Commit changes and rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Catalogue, site figures and search index already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto: rebuild All products catalogue, site figures and search index"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
